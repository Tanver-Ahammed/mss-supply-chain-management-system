services:
  mss_sc_admin_app:
    container_name: mss_sc_admin_app
    build:
      context: ./therap-supply-chain-admin-panel
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_db:5432/supply_chain
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=12345
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - mss_hms_network

  mss_sc_user_app:
    container_name: mss_sc_user_app
    build:
      context: ./therap-supply-chain-user-panel
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_db:5432/supply_chain
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=12345
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - mss_hms_network

  postgres_db:
    container_name: postgres_db
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: supply_chain
    volumes:
      - supply-chain-vol:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supply_chain"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mss_hms_network

volumes:
  supply-chain-vol:

networks:
  mss_hms_network:
    driver: bridge
    ipam:
      driver: default
